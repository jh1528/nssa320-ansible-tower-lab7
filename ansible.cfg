# ==============================================================================
# NSSA320 Lab 7 - Ansible Configuration
# File: ansible.cfg
#
# Purpose:
#   Defines the default inventory, remote service account, SSH behavior,
#   Python interpreter discovery, and privilege-escalation settings used
#   by the Lab 7 command-line Ansible workflow.
#
# Notes:
#   AWX stores its own inventory and credentials. This file primarily supports
#   repository testing and command-line verification from the AWX host.
# ==============================================================================

[defaults]
inventory = inventory.inv
remote_user = ansible
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
bin_ansible_callbacks = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
