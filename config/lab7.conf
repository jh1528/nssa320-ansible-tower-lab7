# ==============================================================================
# NSSA320 Lab 7 - AWX Network Configuration
# ==============================================================================
#
# Purpose:
#   This file is the single source of truth for the Lab 7 environment.
#   Scripts source this file so hostnames, IP addresses, gateway, DNS, and
#   validation targets are not hardcoded in multiple places.
#
# RICE Framework:
#   Reproducibility - One config file defines the lab network.
#   Idempotency     - Scripts compare/apply the same desired state every run.
#   Composability   - Other scripts import this file as needed.
#   Evolvability    - The subnet/domain can be changed here later.
#
# Security Note:
#   Do NOT store passwords, GitHub tokens, private SSH keys, or secrets here.
# ==============================================================================


# ------------------------------------------------------------------------------
# Domain and subnet
# ------------------------------------------------------------------------------

DOMAIN="jh1528.com"

NETWORK_CIDR="192.168.1.0/24"
SUBNET_PREFIX="24"
SUBNET_MASK="255.255.255.0"
BROADCAST_IP="192.168.1.255"


# ------------------------------------------------------------------------------
# Gateway
# ------------------------------------------------------------------------------

GATEWAY_HOST="gateway"
GATEWAY_IP="192.168.1.1"
GATEWAY_FQDN="${GATEWAY_HOST}.${DOMAIN}"


# ------------------------------------------------------------------------------
# AWX controller
# ------------------------------------------------------------------------------

AWX_HOST="awx"
AWX_IP="192.168.1.101"
AWX_FQDN="${AWX_HOST}.${DOMAIN}"


# ------------------------------------------------------------------------------
# Linux managed nodes
# ------------------------------------------------------------------------------

ANSIBLE1_HOST="ansible1"
ANSIBLE1_IP="192.168.1.102"
ANSIBLE1_FQDN="${ANSIBLE1_HOST}.${DOMAIN}"

ANSIBLE2_HOST="ansible2"
ANSIBLE2_IP="192.168.1.103"
ANSIBLE2_FQDN="${ANSIBLE2_HOST}.${DOMAIN}"

UBUNTU_HOST="ubuntu"
UBUNTU_IP="192.168.1.104"
UBUNTU_FQDN="${UBUNTU_HOST}.${DOMAIN}"


# ------------------------------------------------------------------------------
# Windows managed node
# ------------------------------------------------------------------------------

WIN11_HOST="win11"
WIN11_IP="192.168.1.105"
WIN11_FQDN="${WIN11_HOST}.${DOMAIN}"


# ------------------------------------------------------------------------------
# DNS
# ------------------------------------------------------------------------------
#
# Local lab hostnames are resolved with /etc/hosts.
# DNS here is only for external internet name resolution.
# ------------------------------------------------------------------------------

DNS_SERVERS="8.8.8.8 1.1.1.1"


# ------------------------------------------------------------------------------
# Users
# ------------------------------------------------------------------------------

LAB_USER="student"
ANSIBLE_SERVICE_USER="ansible"


# ------------------------------------------------------------------------------
# Lab 7 validation targets
# ------------------------------------------------------------------------------
#
# Validation scripts will test connectivity to these hosts from the AWX node.
# These names must resolve through /etc/hosts or DNS.
# ------------------------------------------------------------------------------

PING_TARGETS="gateway ansible1 ansible2 ubuntu win11"
