#!/usr/bin/env bash
# ==============================================================================
# lab7.conf
# ==============================================================================
#
# Central configuration for NSSA320 Lab 7.
#
# Purpose:
#   Stores the Lab 7 hostnames, IP addresses, domain, subnet, gateway,
#   and DNS settings used by the shared libraries and setup scripts.
#
# Design:
#   This file contains configuration values only.
#   It should be sourced by scripts and libraries.
#
# Version:
#   2.1
#
# Changes:
#   - Corrected the pfSense LAN gateway to 192.168.1.254.
#   - Updated the gateway hostname and managed hosts block.
#
# ==============================================================================


# ==============================================================================
# Source Guard
# ==============================================================================

if [[ -n "${LAB7_CONF_LOADED:-}" ]]; then
    return 0
fi

LAB7_CONF_LOADED="true"


# ==============================================================================
# Lab Identity
# ==============================================================================

LAB_NAME="NSSA320 Lab 7"
LAB_VERSION="2.1"

DOMAIN="jh1528.com"


# ==============================================================================
# Network Configuration
# ==============================================================================

NETWORK_CIDR="192.168.1.0/24"
SUBNET_PREFIX="24"
SUBNET_MASK="255.255.255.0"

GATEWAY_HOST="gateway"
GATEWAY_IP="192.168.1.254"
GATEWAY_FQDN="${GATEWAY_HOST}.${DOMAIN}"

DNS_SERVERS="8.8.8.8 1.1.1.1"


# ==============================================================================
# AWX Host
# ==============================================================================

AWX_HOST="awx"
AWX_IP="192.168.1.101"
AWX_FQDN="${AWX_HOST}.${DOMAIN}"


# ==============================================================================
# Rocky Linux Managed Hosts
# ==============================================================================

ANSIBLE1_HOST="ansible1"
ANSIBLE1_IP="192.168.1.102"
ANSIBLE1_FQDN="${ANSIBLE1_HOST}.${DOMAIN}"

ANSIBLE2_HOST="ansible2"
ANSIBLE2_IP="192.168.1.103"
ANSIBLE2_FQDN="${ANSIBLE2_HOST}.${DOMAIN}"


# ==============================================================================
# Ubuntu Managed Host
# ==============================================================================

UBUNTU_HOST="ubuntu"
UBUNTU_IP="192.168.1.104"
UBUNTU_FQDN="${UBUNTU_HOST}.${DOMAIN}"


# ==============================================================================
# Windows Managed Host
# ==============================================================================

WIN11_HOST="win11"
WIN11_IP="192.168.1.105"
WIN11_FQDN="${WIN11_HOST}.${DOMAIN}"


# ==============================================================================
# Host Collections
# ==============================================================================

LAB7_LINUX_ROLES=(
    "awx"
    "ansible1"
    "ansible2"
    "ubuntu"
)

LAB7_MANAGED_LINUX_HOSTS=(
    "ansible1"
    "ansible2"
    "ubuntu"
)

LAB7_ALL_HOSTS=(
    "awx"
    "ansible1"
    "ansible2"
    "ubuntu"
    "win11"
)


# ==============================================================================
# Managed /etc/hosts Block
# ==============================================================================

LAB7_HOSTS_BLOCK_START="# BEGIN NSSA320 LAB 7 MANAGED HOSTS"
LAB7_HOSTS_BLOCK_END="# END NSSA320 LAB 7 MANAGED HOSTS"

LAB7_HOSTS_CONTENT="${LAB7_HOSTS_BLOCK_START}
${AWX_IP} ${AWX_FQDN} ${AWX_HOST}
${ANSIBLE1_IP} ${ANSIBLE1_FQDN} ${ANSIBLE1_HOST}
${ANSIBLE2_IP} ${ANSIBLE2_FQDN} ${ANSIBLE2_HOST}
${UBUNTU_IP} ${UBUNTU_FQDN} ${UBUNTU_HOST}
${WIN11_IP} ${WIN11_FQDN} ${WIN11_HOST}
${GATEWAY_IP} ${GATEWAY_FQDN} ${GATEWAY_HOST}
${LAB7_HOSTS_BLOCK_END}"


# ==============================================================================
# SSH Defaults
# ==============================================================================

SSH_PORT="22"
SSH_SERVICE_RHEL="sshd"
SSH_SERVICE_UBUNTU="ssh"


# ==============================================================================
# Windows Defaults
# ==============================================================================

WINRM_PORT="5985"
WINRM_TRANSPORT="ntlm"
WINRM_SERVER_CERT_VALIDATION="ignore"
