#!/usr/bin/env bash
# ==============================================================================
# lab7.conf
# ==============================================================================
#
# Central configuration for NSSA320 Lab 7.
#
# Purpose:
#  - Store shared Lab 7 hostnames, IP addresses, domain information,
#    network settings, service defaults, and evidence paths.
#  - Provide one global source of truth for Lab 7 scripts and libraries.
#
# Design:
#  - This file contains configuration values only.
#  - Scripts should source this file before sourcing dependent libraries.
#  - Secrets, passwords, private keys, and tokens must not be stored here.
#  - Workflow-specific settings belong in separate configuration files.
#
# Lab Scope:
#  - AWX controller
#  - Two Rocky Linux managed hosts
#  - One Windows 11 managed host
#  - Ubuntu is intentionally excluded from the official Lab 7 environment.
#
# Author:
#  - Jared Husson
#
# ==============================================================================
# Version History
# ==============================================================================
#
# Version: 2.2
# Date: 2026-07-28
#
# Changes:
#  - Removed Ubuntu from the official Lab 7 configuration.
#  - Updated host collections to match the official Lab 7 environment.
#  - Removed the unused Ubuntu SSH service setting.
#  - Added a shared evidence root directory.
#  - Standardized the managed /etc/hosts block content and markers.
#  - Preserved the pfSense LAN gateway at 192.168.1.254.
#
# Version: 2.1
# Date: 2026-07-23
#
# Changes:
#  - Corrected the pfSense LAN gateway to 192.168.1.254.
#  - Updated the gateway hostname and managed hosts block.
#
# ==============================================================================


# ==============================================================================
# Source Guard
# ==============================================================================

if [[ -n "${LAB7_CONF_LOADED:-}" ]]; then
    return 0
fi

LAB7_CONF_LOADED="true"


# ==============================================================================
# Lab Identity
# ==============================================================================

LAB_NAME="NSSA320 Lab 7"
LAB_VERSION="2.2"

DOMAIN="jh1528.com"


# ==============================================================================
# Network Configuration
# ==============================================================================

NETWORK_CIDR="192.168.1.0/24"
SUBNET_PREFIX="24"
SUBNET_MASK="255.255.255.0"

GATEWAY_HOST="gateway"
GATEWAY_IP="192.168.1.254"
GATEWAY_FQDN="${GATEWAY_HOST}.${DOMAIN}"

DNS_SERVERS="8.8.8.8 1.1.1.1"


# ==============================================================================
# AWX Controller
# ==============================================================================

AWX_HOST="awx"
AWX_IP="192.168.1.101"
AWX_FQDN="${AWX_HOST}.${DOMAIN}"


# ==============================================================================
# Rocky Linux Managed Hosts
# ==============================================================================

ANSIBLE1_HOST="ansible1"
ANSIBLE1_IP="192.168.1.102"
ANSIBLE1_FQDN="${ANSIBLE1_HOST}.${DOMAIN}"

ANSIBLE2_HOST="ansible2"
ANSIBLE2_IP="192.168.1.103"
ANSIBLE2_FQDN="${ANSIBLE2_HOST}.${DOMAIN}"


# ==============================================================================
# Windows Managed Host
# ==============================================================================

WIN11_HOST="win11"
WIN11_IP="192.168.1.105"
WIN11_FQDN="${WIN11_HOST}.${DOMAIN}"


# ==============================================================================
# Host Collections
# ==============================================================================

# Linux systems that participate in the Lab 7 environment.
# The AWX controller is included here but is not an AWX-managed target.

LAB7_LINUX_ROLES=(
    "awx"
    "ansible1"
    "ansible2"
)

# Linux hosts managed through Ansible CLI and AWX.

LAB7_MANAGED_LINUX_HOSTS=(
    "ansible1"
    "ansible2"
)

# All computer hosts participating in Lab 7.
# The gateway is network infrastructure and is tracked separately.

LAB7_ALL_HOSTS=(
    "awx"
    "ansible1"
    "ansible2"
    "win11"
)


# ==============================================================================
# Managed /etc/hosts Block
# ==============================================================================

LAB7_HOSTS_BLOCK_START="# BEGIN NSSA320 LAB 7 MANAGED HOSTS"
LAB7_HOSTS_BLOCK_END="# END NSSA320 LAB 7 MANAGED HOSTS"

LAB7_HOSTS_CONTENT="${LAB7_HOSTS_BLOCK_START}
${AWX_IP}      ${AWX_FQDN}       ${AWX_HOST}
${ANSIBLE1_IP} ${ANSIBLE1_FQDN}  ${ANSIBLE1_HOST}
${ANSIBLE2_IP} ${ANSIBLE2_FQDN}  ${ANSIBLE2_HOST}
${WIN11_IP}    ${WIN11_FQDN}     ${WIN11_HOST}
${GATEWAY_IP}  ${GATEWAY_FQDN}   ${GATEWAY_HOST}
${LAB7_HOSTS_BLOCK_END}"


# ==============================================================================
# SSH Defaults
# ==============================================================================

SSH_PORT="22"
SSH_SERVICE_RHEL="sshd"


# ==============================================================================
# Windows and WinRM Defaults
# ==============================================================================

WINRM_PORT="5985"
WINRM_TRANSPORT="ntlm"
WINRM_SERVER_CERT_VALIDATION="ignore"


# ==============================================================================
# Evidence Configuration
# ==============================================================================

EVIDENCE_ROOT="evidence"
