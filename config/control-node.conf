#!/usr/bin/env bash
# ==============================================================================
# control-node.conf
# ==============================================================================
#
# NSSA320 Lab 7 - Control Node Configuration
#
# Purpose:
#  - Define the software and automation dependencies required by the Lab 7
#    AWX/control node.
#  - Extend the Lab 4 Linux Ansible control-node foundation with the Windows
#    management requirements introduced in Lab 5.
#  - Provide one configuration source for package, command, Python module,
#    and Ansible collection requirements.
#
# Scope:
#  - AWX/control node only.
#  - Does not configure managed Linux hosts.
#  - Does not configure the Windows 11 host itself.
#  - Does not install packages directly.
#
# Design:
#  - This file contains configuration values only.
#  - Installation and validation logic belongs in lib/packages.sh.
#  - Runnable workflows belong in scripts/.
#  - Secrets, passwords, SSH private keys, and tokens must not be stored here.
#
# RICE Framework:
#  - Reproducibility:
#      Defines the dependencies required to reproduce the Lab 7 control node.
#
#  - Idempotency:
#      Calling scripts can compare these requirements against the installed
#      system state before making changes.
#
#  - Composability:
#      Shared package and validation libraries can consume these arrays without
#      duplicating dependency definitions.
#
#  - Evolvability:
#      Future Lab 7 dependencies can be added here without rewriting package
#      installation or validation workflows.
#
# Author:
#  - Jared Husson
#
# ==============================================================================
# Version History
# ==============================================================================
#
# Version: 1.0
# Date: 2026-08-07
#
# Changes:
#  - Added initial Lab 7 control-node dependency configuration.
#  - Reused the Lab 4 Ansible control-node foundation.
#  - Added Python 3.12 and pywinrm requirements from the Lab 5 Windows workflow.
#  - Added required Ansible collections for Linux and Windows automation.
#  - Kept credentials and secrets outside the repository configuration.
#
# ==============================================================================


# ==============================================================================
# Source Guard
# ==============================================================================

if [[ -n "${LAB7_CONTROL_NODE_CONF_LOADED:-}" ]]; then
    return 0
fi

LAB7_CONTROL_NODE_CONF_LOADED="true"


# ==============================================================================
# Control Node Identity
# ==============================================================================

CONTROL_NODE_NAME="Lab 7 AWX Control Node"

CONTROL_NODE_ROLE="awx"


# ==============================================================================
# Required System Packages
# ==============================================================================

LAB7_REQUIRED_PACKAGES=(
    "ansible"
    "python3.12-pip"
)


# ==============================================================================
# Required Commands
# ==============================================================================

LAB7_REQUIRED_COMMANDS=(
    "ansible"
    "ansible-galaxy"
    "python3.12"
    "dnf"
)


# ==============================================================================
# Required Python Modules
# ==============================================================================

LAB7_REQUIRED_PYTHON_MODULES=(
    "winrm"
)


# ==============================================================================
# Required Ansible Collections
# ==============================================================================

LAB7_REQUIRED_COLLECTIONS=(
    "ansible.windows"
    "ansible.posix"
)


# ==============================================================================
# Python Runtime
# ==============================================================================

LAB7_PYTHON_BIN="/usr/bin/python3.12"

LAB7_PIP_MODULE="pip"


# ==============================================================================
# Windows Management Requirements
# ==============================================================================

LAB7_WINRM_PYTHON_PACKAGE="pywinrm"

LAB7_WINDOWS_COLLECTION="ansible.windows"


# ==============================================================================
# Linux Management Requirements
# ==============================================================================

LAB7_POSIX_COLLECTION="ansible.posix"
