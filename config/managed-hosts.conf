# NSSA320 Lab 7 - Managed Host Configuration
# File: config/managed-hosts.conf
#
# Purpose:
#   Stores configuration values used to prepare and verify the Linux
#   managed hosts for SSH and Ansible access.
#
# Scope:
#   Linux managed-host setup and verification only.
#
# Design:
#   config/lab7.conf remains the primary source of hostnames, IP addresses,
#   domain information, and global Lab 7 settings.
#
#   This file stores only managed-host workflow settings such as usernames,
#   SSH key paths, inventory groups, and evidence paths.
#
#   This file must not contain passwords, tokens, private keys, or other
#   sensitive information.
#
# Author:
#   Jared Husson
#
# ==============================================================================
# Version History
# ==============================================================================
#
# Version: 1.0
# Date: 2026-07-23
#
# Changes:
#   - Migrated the Lab 4 Activity 3 configuration to Lab 7.
#   - Removed the old ~/lab4 inventory path.
#   - Reused host values from config/lab7.conf.
#   - Renamed activity-specific variables for general reuse.
#
# ==============================================================================


# ==============================================================================
# Source Guard
# ==============================================================================

if [[ -n "${LAB7_MANAGED_HOSTS_CONF_LOADED:-}" ]]; then
    return 0
fi

LAB7_MANAGED_HOSTS_CONF_LOADED="true"


# ==============================================================================
# Configuration Metadata
# ==============================================================================

MANAGED_HOSTS_CONFIG_VERSION="v1.0"
MANAGED_HOSTS_CONFIG_NAME="Managed Host Setup"


# ==============================================================================
# Evidence Paths
# ==============================================================================

MANAGED_HOSTS_EVIDENCE_DIR="${EVIDENCE_ROOT:-evidence}/managed-hosts"
MANAGED_HOSTS_ARCHIVE_DIR="${MANAGED_HOSTS_EVIDENCE_DIR}/archive"

MANAGED_HOSTS_SETUP_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/setup.txt"
MANAGED_HOSTS_VERIFY_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/verification.txt"
MANAGED_HOSTS_KEY_TEST_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/key-authentication-test.txt"

MANAGED_HOSTS_SCREENSHOT_DELAY_SECONDS="5"


# ==============================================================================
# Repository Inventory
# ==============================================================================

LAB7_REPO_ROOT="${LAB7_REPO_ROOT:-$(pwd)}"
LAB7_INVENTORY_FILE="${LAB7_REPO_ROOT}/inventory.inv"


# ==============================================================================
# User Configuration
# ==============================================================================

MANAGED_HOSTS_REMOTE_USER="student"
MANAGED_HOSTS_SERVICE_USER="ansible"


# ==============================================================================
# Managed Host Groups
# ==============================================================================

MANAGED_HOSTS_UBUNTU_GROUP="ubuntu_hosts"
MANAGED_HOSTS_ROCKY_GROUP="rocky_hosts"
MANAGED_HOSTS_ALL_GROUP="all"


# ==============================================================================
# Managed Hosts
# ==============================================================================

MANAGED_HOSTS_UBUNTU=(
    "${UBUNTU_HOST}"
)

MANAGED_HOSTS_ROCKY=(
    "${ANSIBLE1_HOST}"
    "${ANSIBLE2_HOST}"
)

MANAGED_HOSTS_LINUX=(
    "${ANSIBLE1_HOST}"
    "${ANSIBLE2_HOST}"
    "${UBUNTU_HOST}"
)


# ==============================================================================
# SSH Configuration
# ==============================================================================

MANAGED_HOSTS_SSH_KEY_PATH="${HOME}/.ssh/id_rsa"
MANAGED_HOSTS_SSH_PUBLIC_KEY_PATH="${MANAGED_HOSTS_SSH_KEY_PATH}.pub"

MANAGED_HOSTS_SSH_CONNECT_TIMEOUT_SECONDS="10"


# ==============================================================================
# Required Commands
# ==============================================================================

MANAGED_HOSTS_REQUIRED_COMMANDS=(
    hostname
    date
    ssh
    ssh-keygen
    ssh-copy-id
    ansible
)
