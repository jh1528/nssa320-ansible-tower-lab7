#!/usr/bin/env bash
#
# NSSA320 Lab 7 - Managed Host Configuration
# File: config/managed-hosts.conf
#
# Purpose:
#   Stores configuration values used when preparing and validating the
#   Lab 7 Rocky Linux managed hosts for Ansible CLI and AWX access.
#
# Scope:
#   Lab 7 includes two Rocky Linux managed hosts:
#
#     ansible1
#     ansible2
#
#   Ubuntu is intentionally excluded because it is not part of the
#   official Lab 7 environment.
#
# Safety:
#   This file must not contain passwords, credentials, private keys,
#   GitHub tokens, AWX tokens, or other secrets.
#
# Design Notes:
#   config/lab7.conf remains the global source of truth for hostnames,
#   IP addresses, domain information, and network settings.
#
#   This file contains only managed-host workflow settings.
#
#   scripts/setup-managed-hosts.sh creates and updates inventory.inv
#   idempotently using MANAGED_HOSTS_INVENTORY_CONTENT.
#
#   The local inventory provides a command-line validation path before
#   the equivalent inventory is created in the AWX web interface.
#
#   Windows 11 is intentionally excluded because it uses a separate
#   Windows-only AWX inventory and WinRM credential workflow.
#
# RICE Notes:
#   Reproducibility - centralizes managed-host workflow settings.
#   Idempotency     - supports repeatable inventory and host preparation.
#   Composability   - can be reused by setup and validation scripts.
#   Evolvability    - keeps Linux and Windows workflows separated.
#
# Version History:
#   v2.0 - Refactored inventory and host scope for the official Lab 7
#          environment. Removed Ubuntu and standardized the Linux group.
#   v1.1 - Added generated inventory content for Linux managed hosts.
#   v1.0 - Initial Lab 7 managed-host configuration.

# ---------------------------------------------------------------------------
# Managed-host workflow metadata
# ---------------------------------------------------------------------------

MANAGED_HOSTS_VERSION="v2.0"
MANAGED_HOSTS_NAME="Lab 7 Rocky Linux Managed Host Preparation"

# ---------------------------------------------------------------------------
# Inventory configuration
# ---------------------------------------------------------------------------

# The setup script runs from the repository root.
MANAGED_HOSTS_INVENTORY_FILE="inventory.inv"

# ---------------------------------------------------------------------------
# Managed-host account configuration
# ---------------------------------------------------------------------------

# Existing account used for SSH, Ansible CLI, and the AWX Machine Credential.
MANAGED_HOSTS_REMOTE_USER="student"

# Lab 7 uses the existing student account rather than creating a separate
# Ansible service account.
MANAGED_HOSTS_SERVICE_USER="${MANAGED_HOSTS_REMOTE_USER}"

# Passwords are intentionally not stored in this file.
# Authentication secrets belong in the AWX credential system.

# ---------------------------------------------------------------------------
# Inventory group names
# ---------------------------------------------------------------------------

# Must match hosts: linux in the Lab 7 playbook.
MANAGED_HOSTS_LINUX_GROUP="linux"

# ---------------------------------------------------------------------------
# Rocky Linux managed hosts
# ---------------------------------------------------------------------------

# Hostname variables normally come from config/lab7.conf.
# Fallback values keep this file usable during development.

MANAGED_HOSTS_LINUX=(
  "${ANSIBLE1_HOST:-ansible1}"
  "${ANSIBLE2_HOST:-ansible2}"
)

# ---------------------------------------------------------------------------
# Expected inventory content
# ---------------------------------------------------------------------------

# scripts/setup-managed-hosts.sh compares inventory.inv against this content.
# The file is created when missing and rewritten only when the content differs.
#
# Explicit ansible_host IP values are included because the AWX execution
# environment may not use the AWX host's /etc/hosts file.

MANAGED_HOSTS_INVENTORY_CONTENT="[${MANAGED_HOSTS_LINUX_GROUP}]
${ANSIBLE1_HOST:-ansible1} ansible_host=${ANSIBLE1_IP:-192.168.1.102}
${ANSIBLE2_HOST:-ansible2} ansible_host=${ANSIBLE2_IP:-192.168.1.103}

[${MANAGED_HOSTS_LINUX_GROUP}:vars]
ansible_user=${MANAGED_HOSTS_SERVICE_USER}
ansible_python_interpreter=/usr/bin/python3.9
"

# ---------------------------------------------------------------------------
# SSH configuration
# ---------------------------------------------------------------------------

# Lab 7 uses an ED25519 key pair.
MANAGED_HOSTS_SSH_KEY_PATH="${HOME}/.ssh/id_ed25519"
MANAGED_HOSTS_SSH_PUBLIC_KEY_PATH="${MANAGED_HOSTS_SSH_KEY_PATH}.pub"

MANAGED_HOSTS_SSH_CONNECT_TIMEOUT_SECONDS="10"

# ---------------------------------------------------------------------------
# Required local commands
# ---------------------------------------------------------------------------

MANAGED_HOSTS_REQUIRED_COMMANDS=(
  hostname
  date
  ssh
  ssh-keygen
  ssh-copy-id
  ansible
  ansible-inventory
)

# ---------------------------------------------------------------------------
# Evidence configuration
# ---------------------------------------------------------------------------

# Uses EVIDENCE_ROOT from config/lab7.conf when available.
# Falls back to the repository evidence directory.

MANAGED_HOSTS_EVIDENCE_DIR="${EVIDENCE_ROOT:-evidence}/managed-hosts"
MANAGED_HOSTS_ARCHIVE_DIR="${MANAGED_HOSTS_EVIDENCE_DIR}/archive"

MANAGED_HOSTS_SETUP_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/managed-hosts-setup.txt"
MANAGED_HOSTS_VERIFY_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/managed-hosts-verification.txt"
MANAGED_HOSTS_SSH_VERIFY_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/ssh-key-authentication-test.txt"

# Optional evidence files for comparing initial and idempotent setup runs.

MANAGED_HOSTS_USER_CREATE_FIRST_RUN_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/managed-hosts-first-run.txt"
MANAGED_HOSTS_USER_CREATE_IDEMPOTENT_OUTPUT="${MANAGED_HOSTS_EVIDENCE_DIR}/managed-hosts-idempotent-rerun.txt"

# ---------------------------------------------------------------------------
# Evidence capture settings
# ---------------------------------------------------------------------------

MANAGED_HOSTS_SCREENSHOT_DELAY_SECONDS="5"
